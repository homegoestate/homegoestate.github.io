name: Official site smoke checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check facebook-feed.js
          node --check tainan-map/app.js
          node --check tainan-map/data-loader.js
          node --check tainan-map/feedback.js
      - name: Website structure and links
        run: node scripts/site-smoke.mjs
