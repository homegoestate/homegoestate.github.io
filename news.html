<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房地產新知｜宏國地政｜易丞地政</title><meta name="description" content="台南房地產、稅務、貸款、交易安全與財產傳承專業內容。"><link rel="stylesheet" href="styles.css"></head><body><main id="main">
<section class="page-hero"><div class="container"><div class="eyebrow">INSIGHTS</div><h1 class="page-title">房地產新知</h1><p>已移轉舊官網文章，可依關鍵字搜尋房地合一稅、貸款、詐騙、繼承與交易安全。</p></div></section>
<section class="section"><div class="container"><div class="filters"><input id="news-search" class="input" type="search" placeholder="搜尋文章關鍵字" aria-label="搜尋文章"><select id="news-sort" class="select" aria-label="文章排序"><option value="new">最新優先</option><option value="old">最舊優先</option></select></div><div id="news-grid" class="grid grid-3" aria-live="polite"></div><div class="pagination"><button id="prev" type="button">上一頁</button><strong id="page-status"></strong><button id="next" type="button">下一頁</button></div></div></section>
</main><dialog id="article-dialog" class="dialog"><div class="dialog-inner"><button class="dialog-close" aria-label="關閉文章" type="button">×</button><time id="dialog-date"></time><h2 id="dialog-title"></h2><div id="dialog-body" class="article-body"></div><div id="dialog-images" class="article-images"></div></div></dialog><script src="app.js"></script><script>
let articles=[], page=1; const perPage=9; const grid=document.getElementById("news-grid"), search=document.getElementById("news-search"), sort=document.getElementById("news-sort"), dialog=document.getElementById("article-dialog");
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function filtered(){const q=search.value.trim().toLowerCase(); const list=articles.filter(a=>!q||(`${a.title} ${a.body}`).toLowerCase().includes(q)); return sort.value==='old'?[...list].reverse():list;}
function render(){const list=filtered(), pages=Math.max(1,Math.ceil(list.length/perPage)); page=Math.min(page,pages); const items=list.slice((page-1)*perPage,page*perPage); grid.innerHTML=items.map(a=>`<article class="card article-card" tabindex="0" role="button" data-id="${a.id}" aria-label="閱讀文章：${escapeHtml(a.title)}"><time>${escapeHtml(a.date)}</time><h3>${escapeHtml(a.title)}</h3><span class="card-link">閱讀全文 →</span></article>`).join("")||'<article class="card"><h3>沒有相符文章</h3><p>請更換關鍵字。</p></article>'; document.getElementById('page-status').textContent=`第 ${page}／${pages} 頁`; document.getElementById('prev').disabled=page<=1; document.getElementById('next').disabled=page>=pages;}
function openArticle(id){const a=articles.find(x=>x.id===id); if(!a)return; document.getElementById('dialog-date').textContent=a.date; document.getElementById('dialog-title').textContent=a.title; document.getElementById('dialog-body').textContent=a.body||'此篇內容請洽官方 LINE。'; document.getElementById('dialog-images').innerHTML=(a.images||[]).filter(x=>!x.endsWith('.svg')).map((src,i)=>`<img loading="lazy" src="${src}" alt="${escapeHtml(a.title)} 圖片 ${i+1}">`).join(''); dialog.showModal();}
grid.addEventListener('click',e=>{const card=e.target.closest('[data-id]'); if(card)openArticle(card.dataset.id)}); grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.id)openArticle(e.target.dataset.id)}); document.querySelector('.dialog-close').addEventListener('click',()=>dialog.close()); dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
search.addEventListener('input',()=>{page=1;render()}); sort.addEventListener('change',()=>{page=1;render()}); document.getElementById('prev').addEventListener('click',()=>{page--;render();scrollTo({top:300,behavior:'smooth'})}); document.getElementById('next').addEventListener('click',()=>{page++;render();scrollTo({top:300,behavior:'smooth'})});
fetch('data/news.json').then(r=>r.json()).then(data=>{articles=data;render()}).catch(()=>{grid.innerHTML='<article class="card"><h3>文章載入中斷</h3><p>請重新整理或用 LINE 聯絡我們。</p></article>'});
</script></body></html>
